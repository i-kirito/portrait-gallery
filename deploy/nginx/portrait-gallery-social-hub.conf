server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 8.134.251.200;

    ssl_certificate /etc/lego-social-hub/certificates/8.134.251.200.crt;
    ssl_certificate_key /etc/lego-social-hub/certificates/8.134.251.200.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SocialHubTLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log off;
    error_log /dev/null crit;
    server_tokens off;

    location ^~ /api/social/hub/ {
        client_max_body_size 70m;
        client_body_timeout 180s;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://127.0.0.1:18889;
    }

    location / {
        return 404;
    }
}
