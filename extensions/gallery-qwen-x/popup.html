<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>画廊魔法棒 · Qwen X</title><link rel="stylesheet" href="ui.css"></head><body>
<main><header><span class="mark">✦</span><div><h1>画廊魔法棒</h1><p>Qwen-Image-2.1 Q8 · 仅图生图</p></div></header>
<section><h2>画廊设置</h2><p>连接地址、修改提示词和采样步数统一在画廊的“设置 → Chrome 扩展”中管理。扩展弹窗只负责批量上传和查看最近任务。</p><div class="actions"><button id="openGallery" class="primary">打开画廊</button></div></section>
<section><h2>批量上传改图</h2><p>选择多张本地图片，按当前提示词逐张提交。结果默认只在扩展中查看，不会自动保存到画廊。</p><label for="uploadImages">图片（JPEG、PNG、WEBP，最多 12 张）<input id="uploadImages" type="file" multiple accept="image/jpeg,image/png,image/webp"></label><div class="actions"><button class="primary" id="batchGenerate">一键改图</button><span id="batchStatus" role="status" aria-live="polite"></span></div></section>
<div id="status" role="status"></div><section><h2>最近任务</h2><div id="jobs"></div><button id="refresh">刷新任务</button></section><footer>只处理你点选的 X 静态图片。原图保留，改后图默认直接显示在原图位置；点击“保存到画廊”后才会保存。</footer></main><script src="shared.js"></script><script src="popup.js"></script></body></html>
