services:
  portrait-gallery:
    image: ${PORTRAIT_GALLERY_IMAGE:-hermes-portrait-gallery:latest}
    build: .
    container_name: hermes-portrait-gallery
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./app/web:/app/app/web
    environment:
      - TZ=Asia/Shanghai
      - GALLERY_PASSWORD=${GALLERY_PASSWORD:-}
